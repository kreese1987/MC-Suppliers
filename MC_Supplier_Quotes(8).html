<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M+C Supplier Quotes · SA Festival 2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0f14;--surface:#141820;--surface2:#181d28;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--gold:#d4a054;--gold2:#b8860b;--gold-bg:rgba(212,160,84,0.12);--text:#e2e8f0;--text2:#cbd5e1;--muted:#94a3b8;--dim:#64748b;--dark:#475569;--green:#34d399;--green-bg:#166534;--blue:#60a5fa;--blue-bg:#1e3a5f;--purple:#a78bfa;--orange:#f97316;--orange-bg:#9a3412;--yellow:#fbbf24;--yellow-bg:#a16207;--red:#ef4444;--red-bg:#7f1d1d;--red-light:#fca5a5;--red-dark:#450a0a;--mono:'JetBrains Mono',monospace;--sans:'DM Sans',-apple-system,sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
input,select,button,textarea{font-family:inherit}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#12151c,var(--bg))}
.header-left{display:flex;align-items:center;gap:14px}
.logo{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);font:800 14px var(--mono);padding:8px 10px;border-radius:8px;letter-spacing:1px}
.header h1{font-size:18px;font-weight:700;color:#f1f5f9;letter-spacing:-0.3px}
.header p{font-size:12px;color:var(--dim);margin-top:2px}
.rate{font:500 12px var(--mono);color:var(--gold);background:var(--gold-bg);padding:6px 12px;border-radius:6px}
.nav{display:flex;gap:2px;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap}
.nav button{background:none;border:none;color:var(--dim);font-size:13px;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;transition:all .15s}
.nav button:hover{color:var(--muted)}
.nav button.active{background:var(--gold-bg);color:var(--gold)}
.main{padding:20px 24px;max-width:1000px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card-title{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.card-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;text-align:center;border-top:3px solid var(--blue)}
.stat .val{font:700 28px var(--mono);color:#f1f5f9}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.form-card{background:var(--surface2);border:1px solid rgba(212,160,84,0.2);border-radius:10px;padding:20px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.card-row{flex-direction:column}.header{flex-direction:column;gap:12px;align-items:flex-start}}
label.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
input.inp,select.inp,textarea.inp{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;outline:none}
input.inp:focus,select.inp:focus{border-color:var(--gold)}
select.filt{padding:8px 12px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sm{background:#1e293b;color:var(--text2);border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#2d3a4d}
.btn-danger{background:var(--red-dark);color:var(--red-light)}
.btn-danger:hover{background:#5f0a0a}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:var(--text);display:inline-block}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;transition:border-color .15s}
.q-card:hover{border-color:rgba(255,255,255,0.1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
td{padding:6px 8px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(255,255,255,0.03)}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.bar-track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px}
.bar-fill{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),#e8c47a);transition:width .5s}
.city-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border-radius:8px;padding:4px;width:fit-content}
.city-tab{padding:6px 16px;border-radius:6px;border:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);background:none;transition:all .15s}
.city-tab.active-cpt{background:#166534;color:var(--text)}
.city-tab.active-jhb{background:#1e3a5f;color:var(--text)}
.city-tab.active-all{background:rgba(255,255,255,0.08);color:var(--text)}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mono{font-family:var(--mono)}
.export-bar{display:flex;gap:8px;justify-content:flex-end;padding:8px 24px;border-bottom:1px solid rgba(255,255,255,0.03)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 36px;width:100%;max-width:380px;text-align:center}
.login-box .logo{display:inline-block;margin-bottom:20px;font-size:18px;padding:12px 16px}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.login-box .sub{font-size:13px;color:var(--dim);margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}
.login-box input:focus{border-color:var(--gold)}
.login-box .btn-primary{width:100%;padding:12px;font-size:14px;border-radius:8px}
.login-box .error{color:var(--red);font-size:12px;margin-bottom:12px}
.login-box .hint{color:var(--dim);font-size:11px;margin-top:16px}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--muted);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red-light)}
.dropzone{border:2px dashed rgba(212,160,84,0.3);border-radius:12px;padding:32px 24px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(212,160,84,0.03);margin-bottom:16px}
.dropzone:hover,.dropzone.over{border-color:var(--gold);background:rgba(212,160,84,0.08)}
.dropzone .icon{font-size:32px;margin-bottom:8px}
.dropzone .main-text{color:var(--text);font-weight:600;font-size:14px;margin-bottom:4px}
.dropzone .sub-text{color:var(--dim);font-size:12px}
.scan-status{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.scan-status .filename{color:var(--gold);font-size:13px;font-weight:600;margin-bottom:8px}
.scan-progress{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:8px}
.scan-progress .fill{height:100%;background:linear-gradient(90deg,var(--gold),#e8c47a);border-radius:2px;animation:scanPulse 1.5s ease-in-out infinite}
@keyframes scanPulse{0%{width:20%}50%{width:80%}100%{width:20%}}
.scan-msg{color:var(--muted);font-size:12px}
.scan-err{color:var(--red);font-size:12px;margin-top:8px}
.scan-preview{background:var(--surface2);border:1px solid rgba(212,160,84,0.2);border-radius:10px;padding:16px;margin-bottom:16px}
.scan-preview h4{color:var(--gold);font-size:13px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.6px}
.ai-chat{display:flex;flex-direction:column;gap:12px}
.ai-messages{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.ai-msg{padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.ai-msg.user{background:var(--gold-bg);color:var(--gold);align-self:flex-end;max-width:80%;border-bottom-right-radius:2px}
.ai-msg.bot{background:var(--surface);border:1px solid var(--border);color:var(--text2);align-self:flex-start;max-width:90%;border-bottom-left-radius:2px}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1}
.ai-section{margin-bottom:24px}
.ai-section h3{font-size:14px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.alert-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;border-left:3px solid var(--yellow)}
.alert-card.risk{border-left-color:var(--red)}
.alert-card.info{border-left-color:var(--blue)}
.alert-card.ok{border-left-color:var(--green)}
.alert-card .alert-title{font-size:13px;font-weight:600;margin-bottom:4px}
.alert-card .alert-body{font-size:12px;color:var(--muted);line-height:1.5}
.report-output{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap;max-height:500px;overflow-y:auto}
.negot-brief{background:var(--surface2);border:1px solid rgba(212,160,84,0.2);border-radius:10px;padding:16px;margin-top:16px;font-size:13px;line-height:1.7;color:var(--text2);white-space:pre-wrap}
.thinking-dots{display:inline-flex;gap:4px;padding:8px 0}
.thinking-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:dotPulse 1.2s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;

const RATE=17.01;
const CITIES=["CPT","JHB"];
const CATEGORIES=["Artist Relations & Hospitality","Catering & Concessions","Décor & Environmental Design","Production Crew & Management","Venue Hire","Technical Production","Safety & Security","Site Operations & Infrastructure","VIP & VVIP Experience","Consumables & Contingency","Planning","Production Venues","Permits & Licensing","Site Infrastructure","Production Staff","Insurances & Contingency"];
const STATUSES=["Pending","Approved","Rejected","Negotiating"];
const fmt=n=>n?.toLocaleString("en-ZA",{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtUSD=n=>(n/RATE).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:0});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}

// Invoice scanning via Claude API
async function scanInvoice(file,apiKey){
  if(!apiKey){throw new Error("Set your Anthropic API key in Settings to scan invoices")}
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=()=>rej(new Error("Read failed"));r.readAsDataURL(file)});
  const isPDF=file.type==="application/pdf";
  const mediaType=isPDF?"application/pdf":file.type;
  const contentBlock=isPDF
    ?{type:"document",source:{type:"base64",media_type:mediaType,data:b64}}
    :{type:"image",source:{type:"base64",media_type:mediaType,data:b64}};

  const cats=CATEGORIES.join(", ");
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      messages:[{role:"user",content:[
        contentBlock,
        {type:"text",text:`Extract invoice/quote data from this document. Return ONLY valid JSON with no markdown backticks or preamble. Use this exact schema:
{
  "supplier_name": "string — the vendor/company name on the invoice",
  "category": "string — best match from: ${cats}",
  "notes": "string — invoice number, date, or other reference info",
  "line_items": [{"description": "string", "amount": number}]
}
Rules:
- All amounts must be numbers in ZAR (South African Rand). If amounts show a currency symbol like R or ZAR, strip it and give the number. If in USD, multiply by ${RATE} to convert to ZAR.
- If VAT/tax line items exist, include them as separate line items.
- If only a grand total exists with no breakdown, use a single line item with description "Total per invoice".
- For supplier_name, use the company/business name, not a person's name.
- For category, pick the single best match from the list provided.`}
      ]}]
    })
  });
  if(!resp.ok){const e=await resp.text();throw new Error(`API error ${resp.status}: ${e}`)}
  const data=await resp.json();
  const text=data.content.map(c=>c.text||"").join("");
  const clean=text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

function App(){
  const[view,setView]=useState("dashboard");
  const[suppliers,setSuppliers]=useState(()=>load("mc-sup",[]));
  const[quotes,setQuotes]=useState(()=>load("mc-qt",[]));
  const[showSF,setShowSF]=useState(false);
  const[showQF,setShowQF]=useState(false);
  const[editQ,setEditQ]=useState(null);
  const[editS,setEditS]=useState(null);
  const[compCat,setCompCat]=useState("");
  const[compCity,setCompCity]=useState("");
  const[fCity,setFCity]=useState("All");
  const[fCat,setFCat]=useState("All");
  const[fStat,setFStat]=useState("All");
  const[expQ,setExpQ]=useState(null);
  const[supCity,setSupCity]=useState("All");
  const[prefill,setPrefill]=useState(null);
  const[apiKey,setApiKey]=useState(()=>load("mc-api-key",""));
  const[showSettings,setShowSettings]=useState(false);
  const[budgetCPT,setBudgetCPT]=useState(()=>load("mc-budget-cpt",6000000));
  const[budgetJHB,setBudgetJHB]=useState(()=>load("mc-budget-jhb",10000000));
  const[catBudgets,setCatBudgets]=useState(()=>load("mc-cat-budgets",{}));

  useEffect(()=>{save("mc-sup",suppliers)},[suppliers]);
  useEffect(()=>{save("mc-qt",quotes)},[quotes]);
  useEffect(()=>{save("mc-api-key",apiKey)},[apiKey]);
  useEffect(()=>{save("mc-budget-cpt",budgetCPT)},[budgetCPT]);
  useEffect(()=>{save("mc-budget-jhb",budgetJHB)},[budgetJHB]);
  useEffect(()=>{save("mc-cat-budgets",catBudgets)},[catBudgets]);

  const addSup=s=>{setSuppliers(p=>[...p,{...s,id:uid()}]);setShowSF(false)};
  const updSup=s=>{setSuppliers(p=>p.map(x=>x.id===s.id?s:x));setEditS(null)};
  const delSup=id=>{setSuppliers(p=>p.filter(x=>x.id!==id));setQuotes(p=>p.filter(q=>q.supplierId!==id))};
  const addQt=q=>{setQuotes(p=>[...p,{...q,id:uid(),created:new Date().toISOString()}]);setShowQF(false)};
  const updQt=q=>{setQuotes(p=>p.map(x=>x.id===q.id?q:x));setEditQ(null)};
  const delQt=id=>setQuotes(p=>p.filter(x=>x.id!==id));
  const getSup=id=>suppliers.find(s=>s.id===id);

  const totByCity=useMemo(()=>{
    const t={CPT:0,JHB:0};
    quotes.filter(q=>q.status==="Approved").forEach(q=>{
      const s=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
      if(t[q.city]!==undefined)t[q.city]+=s;
    });return t;
  },[quotes]);

  const catTotals=useMemo(()=>{
    const t={};
    quotes.filter(q=>q.status==="Approved").forEach(q=>{
      const s=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
      t[q.category]=(t[q.category]||0)+s;
    });return Object.entries(t).sort((a,b)=>b[1]-a[1]);
  },[quotes]);

  const filtQ=useMemo(()=>quotes.filter(q=>{
    if(fCity!=="All"&&q.city!==fCity)return false;
    if(fCat!=="All"&&q.category!==fCat)return false;
    if(fStat!=="All"&&q.status!==fStat)return false;
    return true;
  }),[quotes,fCity,fCat,fStat]);

  const compQ=useMemo(()=>{
    if(!compCat)return[];
    return quotes.filter(q=>{
      if(q.category!==compCat)return false;
      if(compCity&&q.city!==compCity)return false;
      return true;
    }).sort((a,b)=>{
      const sa=a.lineItems.reduce((x,li)=>x+(li.amount||0),0);
      const sb=b.lineItems.reduce((x,li)=>x+(li.amount||0),0);
      return sa-sb;
    });
  },[quotes,compCat,compCity]);

  const filtSup=useMemo(()=>{
    if(supCity==="All")return suppliers;
    return suppliers.filter(s=>s.city===supCity||s.city==="Both");
  },[suppliers,supCity]);

  const exportData=()=>{
    const data=JSON.stringify({suppliers,quotes},null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="mc_supplier_data.json";a.click();
    URL.revokeObjectURL(url);
  };

  const importData=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.suppliers)setSuppliers(d.suppliers);
        if(d.quotes)setQuotes(d.quotes);
        alert("Data imported successfully");
      }catch(err){alert("Invalid file")}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  return(
    <div>
      <header className="header">
        <div className="header-left">
          <div className="logo">M+C</div>
          <div><h1>Supplier Quotes</h1><p>SA Festival 2027 · Production Budget Tracking</p></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="rate">R{RATE} / $1</div>
        </div>
      </header>
      <div className="export-bar">
        <button className="btn-sm" onClick={()=>setShowSettings(!showSettings)}>{showSettings?"Hide":"⚙ API"} Settings</button>
        <button className="btn-sm" onClick={exportData}>Export Data</button>
        <label className="btn-sm" style={{cursor:"pointer"}}>Import Data<input type="file" accept=".json" onChange={importData} style={{display:"none"}}/></label>
      </div>
      {showSettings&&(
        <div style={{padding:"16px 24px",background:"var(--surface2)",borderBottom:"1px solid var(--border)"}}>
          <div style={{maxWidth:480}}>
            <label className="lbl">Anthropic API Key (required for AI features + invoice scanning)</label>
            <div style={{display:"flex",gap:8}}>
              <input className="inp" type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-api03-..." style={{flex:1,fontFamily:"var(--mono)",fontSize:12}}/>
              {apiKey&&<button className="btn-sm" onClick={()=>setApiKey("")} style={{color:"var(--red-light)"}}>Clear</button>}
            </div>
            <p style={{color:"var(--dim)",fontSize:11,marginTop:6}}>Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" style={{color:"var(--gold)"}}>console.anthropic.com</a> — stored locally in your browser only.</p>
          </div>
        </div>
      )}
      <nav className="nav">
        {[["dashboard","Dashboard"],["quotes","Quotes"],["suppliers","Suppliers"],["compare","Compare"],["budgets","Budgets"],["ai","AI Insights"]].map(([k,l])=>(
          <button key={k} className={view===k?"active":""} onClick={()=>setView(k)}>{l}</button>
        ))}
      </nav>
      <main className="main">
        {view==="dashboard"&&<Dashboard quotes={quotes} suppliers={suppliers} totByCity={totByCity} catTotals={catTotals} getSup={getSup} budgetCPT={budgetCPT} budgetJHB={budgetJHB} catBudgets={catBudgets}/>}
        {view==="quotes"&&<Quotes quotes={filtQ} suppliers={suppliers} getSup={getSup} fCity={fCity} setFCity={setFCity} fCat={fCat} setFCat={setFCat} fStat={fStat} setFStat={setFStat} showForm={showQF} setShowForm={setShowQF} editQ={editQ} setEditQ={setEditQ} onAdd={addQt} onUpdate={updQt} onDelete={delQt} expQ={expQ} setExpQ={setExpQ} prefill={prefill} setPrefill={setPrefill} apiKey={apiKey}/>}
        {view==="suppliers"&&<Suppliers suppliers={filtSup} allSuppliers={suppliers} quotes={quotes} showForm={showSF} setShowForm={setShowSF} editS={editS} setEditS={setEditS} onAdd={addSup} onUpdate={updSup} onDelete={delSup} supCity={supCity} setSupCity={setSupCity}/>}

function StatusBadge({status}){

/* ─── QUOTES ─── */
function InvoiceUpload({suppliers,apiKey,onScanned}){
  const[over,setOver]=useState(false);
  const[scanning,setScanning]=useState(false);
  const[fileName,setFileName]=useState("");
  const[error,setError]=useState("");
  const[result,setResult]=useState(null);
  const fileRef=React.useRef();

  const processFile=async(file)=>{
    if(!apiKey){setError("Set your Anthropic API key in ⚙ API Settings above to scan invoices.");return}
    const valid=["application/pdf","image/png","image/jpeg","image/webp","image/gif"];
    if(!valid.includes(file.type)){setError("Unsupported file type. Use PDF, PNG, JPG, or WEBP.");return}
    if(file.size>20*1024*1024){setError("File too large (max 20MB).");return}
    setFileName(file.name);setError("");setScanning(true);setResult(null);
    try{
      const data=await scanInvoice(file,apiKey);
      setResult(data);setScanning(false);
    }catch(e){
      setError("Scan failed: "+e.message);setScanning(false);
    }
  };
  const onDrop=e=>{e.preventDefault();setOver(false);const f=e.dataTransfer.files[0];if(f)processFile(f)};
  const onPick=e=>{const f=e.target.files[0];if(f)processFile(f);e.target.value=""};

  const matchSupplier=(name)=>{
    if(!name)return "";
    const lower=name.toLowerCase();
    const match=suppliers.find(s=>s.name.toLowerCase().includes(lower)||lower.includes(s.name.toLowerCase()));
    return match?.id||"";
  };

  const useResult=()=>{
    if(!result)return;
    const matchedCat=CATEGORIES.find(c=>c.toLowerCase()===result.category?.toLowerCase())||CATEGORIES[0];
    onScanned({
      supplierId:matchSupplier(result.supplier_name),
      supplierName:result.supplier_name||"",
      city:"CPT",
      category:matchedCat,
      status:"Pending",
      notes:result.notes||"",
      lineItems:(result.line_items||[]).map(li=>({description:li.description||"",amount:parseFloat(li.amount)||0}))
    });
    setResult(null);setFileName("");
  };

  return(
    <div>
      {!scanning&&!result&&(
        <div className={`dropzone${over?" over":""}`} onDragOver={e=>{e.preventDefault();setOver(true)}} onDragLeave={()=>setOver(false)} onDrop={onDrop} onClick={()=>fileRef.current.click()}>
          <div className="icon">📄</div>
          <div className="main-text">Drop an invoice or quote here</div>
          <div className="sub-text">PDF, PNG, JPG — auto-extracts supplier, line items & amounts</div>
          <input ref={fileRef} type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif" style={{display:"none"}} onChange={onPick}/>
        </div>
      )}
      {scanning&&(
        <div className="scan-status">
          <div className="filename">Scanning: {fileName}</div>
          <div className="scan-progress"><div className="fill"/></div>
          <div className="scan-msg">Extracting supplier details, line items, and amounts...</div>
        </div>
      )}
      {error&&<div style={{color:"var(--red)",fontSize:13,marginBottom:12,padding:"8px 12px",background:"rgba(239,68,68,0.1)",borderRadius:8}}>{error} <button className="btn-sm" style={{marginLeft:8,fontSize:11}} onClick={()=>{setError("");setFileName("")}}>Try again</button></div>}
      {result&&(
        <div className="scan-preview">
          <h4>Scan Result — {fileName}</h4>
          <div style={{marginBottom:8}}>
            <span style={{color:"var(--muted)",fontSize:12}}>Supplier: </span>
            <span style={{color:"var(--text)",fontWeight:600}}>{result.supplier_name||"Not detected"}</span>
            {result.category&&<><span style={{color:"var(--muted)",fontSize:12,marginLeft:16}}>Category: </span><span style={{color:"var(--text2)",fontSize:13}}>{result.category}</span></>}
          </div>
          {result.notes&&<div style={{color:"var(--dim)",fontSize:12,marginBottom:8}}>{result.notes}</div>}
          <table>
            <thead><tr><th>Line Item</th><th style={{textAlign:"right"}}>Amount (ZAR)</th></tr></thead>
            <tbody>
              {(result.line_items||[]).map((li,i)=>(
                <tr key={i}>
                  <td>{li.description}</td>
                  <td className="mono" style={{textAlign:"right"}}>R{fmt(li.amount)}</td>
                </tr>
              ))}
              <tr style={{borderTop:"2px solid var(--border)"}}>
                <td style={{fontWeight:600}}>Total</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,color:"var(--gold)"}}>R{fmt((result.line_items||[]).reduce((a,li)=>a+(li.amount||0),0))}</td>
              </tr>
            </tbody>
          </table>
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button className="btn-primary" onClick={useResult}>Use This → Open in Quote Form</button>
            <button className="btn-sm" onClick={()=>{setResult(null);setFileName("")}}>Discard</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Quotes({quotes,suppliers,getSup,fCity,setFCity,fCat,setFCat,fStat,setFStat,showForm,setShowForm,editQ,setEditQ,onAdd,onUpdate,onDelete,expQ,setExpQ,prefill,setPrefill,apiKey}){
  return(
    <div>
      <InvoiceUpload suppliers={suppliers} apiKey={apiKey} onScanned={(data)=>{setPrefill(data);setEditQ(null);setShowForm(true)}}/>

        <button className="btn-primary" onClick={()=>{setEditQ(null);setPrefill(null);setShowForm(true)}}>+ Add Quote</button>
      </div>
      {(showForm||editQ)&&<QuoteForm suppliers={suppliers} initial={editQ} prefill={prefill} onSave={q=>{editQ?onUpdate(q):onAdd(q);setPrefill(null)}} onCancel={()=>{setShowForm(false);setEditQ(null);setPrefill(null)}}/>}
      {quotes.length===0&&!showForm&&<div className="empty"><p>{suppliers.length===0?"Add a supplier first":"No quotes match your filters"}</p></div>}
      {quotes.map(q=>{

              <div>

                  <span className="badge" style={{background:q.city==="CPT"?"var(--green-bg)":"var(--blue-bg)"}}>{q.city}</span>
                  <StatusBadge status={q.status}/>
                  <span style={{fontWeight:600}}>{sup?.name||"Unknown"}</span>
                </div>
                <div style={{color:"var(--muted)",fontSize:13}}>{q.category}</div>
                {q.notes&&<div style={{color:"var(--dim)",fontSize:12,marginTop:2}}>{q.notes}</div>}
              </div>
              <div style={{textAlign:"right"}}>
                <div className="mono" style={{fontWeight:600}}>R{fmt(total)}</div>
                <div className="mono" style={{color:"var(--muted)",fontSize:12}}>{fmtUSD(total)}</div>
              </div>
            </div>
            {exp&&(
              <div style={{marginTop:12,borderTop:"1px solid var(--border)",paddingTop:12}}>
                <table><thead><tr><th>Line Item</th><th style={{textAlign:"right"}}>ZAR</th><th style={{textAlign:"right"}}>USD</th></tr></thead>
                <tbody>{q.lineItems.map((li,i)=>(
                  <tr key={i}><td>{li.description}</td><td className="mono" style={{textAlign:"right"}}>R{fmt(li.amount)}</td><td className="mono" style={{textAlign:"right",color:"var(--muted)"}}>  {fmtUSD(li.amount)}</td></tr>
                ))}</tbody></table>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button className="btn-sm" onClick={()=>setEditQ(q)}>Edit</button>
                  <button className="btn-sm btn-danger" onClick={()=>{if(confirm("Delete this quote?"))onDelete(q.id)}}>Delete</button>
                  {q.status!=="Approved"&&<button className="btn-sm" style={{background:"var(--green-bg)"}} onClick={()=>onUpdate({...q,status:"Approved"})}>Approve</button>}
                  {q.status!=="Rejected"&&<button className="btn-sm" style={{background:"var(--red-bg)"}} onClick={()=>onUpdate({...q,status:"Rejected"})}>Reject</button>}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Filt({value,onChange,opts,label}){
  return <select className="filt" value={value} onChange={e=>onChange(e.target.value)}>{opts.map(o=><option key={o} value={o}>{o==="All"?`${label}: All`:o}</option>)}</select>;
}

function QuoteForm({suppliers,initial,prefill,onSave,onCancel}){
  const defaultForm=prefill
    ?{supplierId:prefill.supplierId||"",city:prefill.city||"CPT",category:prefill.category||CATEGORIES[0],status:prefill.status||"Pending",notes:prefill.notes||"",lineItems:prefill.lineItems&&prefill.lineItems.length>0?prefill.lineItems:[{description:"",amount:0}]}
    :{supplierId:suppliers[0]?.id||"",city:"CPT",category:CATEGORIES[0],status:"Pending",notes:"",lineItems:[{description:"",amount:0}]};

  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));

  const ali=()=>setForm(p=>({...p,lineItems:[...p.lineItems,{description:"",amount:0}]}));
  const rli=i=>setForm(p=>({...p,lineItems:p.lineItems.filter((_,j)=>j!==i)}));
  const total=form.lineItems.reduce((a,li)=>a+(li.amount||0),0);

  return(
    <div className="form-card">
      <h3 style={{marginBottom:16}}>{initial?"Edit Quote":"New Quote"}</h3>
      <div className="form-grid">
        <div><label className="lbl">Supplier</label><select className="inp" value={form.supplierId} onChange={e=>sf("supplierId",e.target.value)}><option value="">Select...</option>{suppliers.map(s=><option key={s.id} value={s.id}>{s.name} ({s.city})</option>)}</select></div>
        <div><label className="lbl">City</label><select className="inp" value={form.city} onChange={e=>sf("city",e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="lbl">Category</label><select className="inp" value={form.category} onChange={e=>sf("category",e.target.value)}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="lbl">Status</label><select className="inp" value={form.status} onChange={e=>sf("status",e.target.value)}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
      </div>
      {unmatchedSupplier&&!form.supplierId&&<div style={{marginTop:8,padding:"8px 12px",background:"rgba(251,191,36,0.1)",borderRadius:6,fontSize:12,color:"var(--yellow)"}}>Invoice supplier "{unmatchedSupplier}" doesn't match any saved supplier. Select one from the dropdown or add them in the Suppliers tab first.</div>}
      <div style={{marginTop:12}}><label className="lbl">Notes</label><input className="inp" value={form.notes} onChange={e=>sf("notes",e.target.value)} placeholder="Optional notes..."/></div>
      <div style={{marginTop:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <label className="lbl">Line Items</label><button className="btn-sm" onClick={ali}>+ Line</button>
        </div>
        {form.lineItems.map((li,i)=>(
          <div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
            <input className="inp" style={{flex:2}} value={li.description} onChange={e=>sli(i,"description",e.target.value)} placeholder="Description"/>
            <input className="inp mono" style={{flex:1}} type="number" value={li.amount||""} onChange={e=>sli(i,"amount",e.target.value)} placeholder="R Amount"/>
            {form.lineItems.length>1&&<button className="btn-sm btn-danger" style={{padding:"4px 10px"}} onClick={()=>rli(i)}>×</button>}
          </div>
        ))}
        <div className="mono" style={{textAlign:"right",marginTop:8,color:"var(--gold)",fontWeight:600}}>Total: R{fmt(total)} · {fmtUSD(total)}</div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button className="btn-primary" onClick={()=>{if(!form.supplierId)return alert("Select a supplier");onSave(form)}}>{initial?"Update":"Save"} Quote</button>

  );

function Budgets({budgetCPT,setBudgetCPT,budgetJHB,setBudgetJHB,catBudgets,setCatBudgets,quotes,getSup}){
  const setCB=(cat,city,val)=>{
    setCatBudgets(prev=>{
      const updated={...prev};
      if(!updated[cat])updated[cat]={CPT:0,JHB:0};
      updated[cat]={...updated[cat],[city]:parseFloat(val)||0};
      return updated;
    });
  };
  const getCB=(cat,city)=>(catBudgets[cat]&&catBudgets[cat][city])||0;

  // Calculate actual spend per category per city from approved quotes
  const actuals=useMemo(()=>{
    const a={};
    quotes.filter(q=>q.status==="Approved").forEach(q=>{
      const t=q.lineItems.reduce((s,li)=>s+(li.amount||0),0);
      if(!a[q.category])a[q.category]={CPT:0,JHB:0};
      if(a[q.category][q.city]!==undefined)a[q.category][q.city]+=t;
    });
    return a;
  },[quotes]);

  const totalAllocCPT=CATEGORIES.reduce((s,c)=>s+getCB(c,"CPT"),0);
  const totalAllocJHB=CATEGORIES.reduce((s,c)=>s+getCB(c,"JHB"),0);
  const totalActCPT=Object.values(actuals).reduce((s,a)=>s+(a.CPT||0),0);
  const totalActJHB=Object.values(actuals).reduce((s,a)=>s+(a.JHB||0),0);

  return(
    <div>
      <h3 style={{marginTop:0,marginBottom:4}}>Budget Allocation</h3>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:16}}>Set your overall city targets and per-category budgets. These drive the AI alerts, reports, and dashboard.</p>

      <div className="card" style={{marginBottom:16}}>
        <h3 className="card-title" style={{marginBottom:12}}>Overall Targets (incl. VAT)</h3>
        <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:200}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <span style={{color:"var(--green)",fontWeight:700,fontSize:14}}>CPT</span>
              <span style={{color:"var(--dim)",fontSize:11}}>Cape Town · Jan 3</span>
            </div>
            <input className="inp mono" type="number" value={budgetCPT} onChange={e=>setBudgetCPT(parseFloat(e.target.value)||0)} style={{fontSize:14}}/>
          </div>
          <div style={{flex:1,minWidth:200}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <span style={{color:"var(--blue)",fontWeight:700,fontSize:14}}>JHB</span>
              <span style={{color:"var(--dim)",fontSize:11}}>Johannesburg · Jan 9</span>
            </div>
            <input className="inp mono" type="number" value={budgetJHB} onChange={e=>setBudgetJHB(parseFloat(e.target.value)||0)} style={{fontSize:14}}/>
          </div>
        </div>
      </div>

      <div className="card">
        <h3 className="card-title" style={{marginBottom:12}}>Category Budgets</h3>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",minWidth:700}}>
            <thead>
              <tr>
                <th style={{textAlign:"left",minWidth:200}}>Category</th>
                <th style={{textAlign:"center",color:"var(--green)",minWidth:120}}>CPT Budget</th>
                <th style={{textAlign:"center",color:"var(--green)",minWidth:90}}>CPT Actual</th>
                <th style={{textAlign:"center",minWidth:80}}>Var</th>
                <th style={{textAlign:"center",color:"var(--blue)",minWidth:120}}>JHB Budget</th>
                <th style={{textAlign:"center",color:"var(--blue)",minWidth:90}}>JHB Actual</th>
                <th style={{textAlign:"center",minWidth:80}}>Var</th>
              </tr>
            </thead>
            <tbody>
              {CATEGORIES.map(cat=>{
                const cptB=getCB(cat,"CPT");
                const jhbB=getCB(cat,"JHB");
                const cptA=(actuals[cat]?.CPT)||0;
                const jhbA=(actuals[cat]?.JHB)||0;
                const cptVar=cptB-cptA;
                const jhbVar=jhbB-jhbA;
                return(
                  <tr key={cat}>
                    <td style={{fontSize:13,padding:"6px 8px",color:"var(--text2)"}}>{cat}</td>
                    <td style={{padding:"4px 6px"}}><input className="inp mono" type="number" value={cptB||""} onChange={e=>setCB(cat,"CPT",e.target.value)} placeholder="0" style={{fontSize:12,textAlign:"right",padding:"5px 8px"}}/></td>
                    <td className="mono" style={{textAlign:"right",fontSize:12,padding:"6px 8px",color:"var(--muted)"}}>{cptA>0?"R"+fmt(cptA):"—"}</td>
                    <td className="mono" style={{textAlign:"right",fontSize:12,padding:"6px 8px",color:cptB===0?"var(--dim)":cptVar<0?"var(--red)":"var(--green)"}}>{cptB>0?(cptVar>=0?"+":"")+fmt(cptVar):"—"}</td>
                    <td style={{padding:"4px 6px"}}><input className="inp mono" type="number" value={jhbB||""} onChange={e=>setCB(cat,"JHB",e.target.value)} placeholder="0" style={{fontSize:12,textAlign:"right",padding:"5px 8px"}}/></td>
                    <td className="mono" style={{textAlign:"right",fontSize:12,padding:"6px 8px",color:"var(--muted)"}}>{jhbA>0?"R"+fmt(jhbA):"—"}</td>
                    <td className="mono" style={{textAlign:"right",fontSize:12,padding:"6px 8px",color:jhbB===0?"var(--dim)":jhbVar<0?"var(--red)":"var(--green)"}}>{jhbB>0?(jhbVar>=0?"+":"")+fmt(jhbVar):"—"}</td>

                );
              })}
            </tbody>
            <tfoot>
              <tr style={{borderTop:"2px solid var(--border)"}}>
                <td style={{fontWeight:700,padding:"8px",fontSize:13}}>TOTAL ALLOCATED</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,padding:"8px",fontSize:12,color:"var(--green)"}}>R{fmt(totalAllocCPT)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:600,padding:"8px",fontSize:12}}>R{fmt(totalActCPT)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:600,padding:"8px",fontSize:12,color:totalAllocCPT-totalActCPT>=0?"var(--green)":"var(--red)"}}>{totalAllocCPT>0?(totalAllocCPT-totalActCPT>=0?"+":"")+fmt(totalAllocCPT-totalActCPT):"—"}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:700,padding:"8px",fontSize:12,color:"var(--blue)"}}>R{fmt(totalAllocJHB)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:600,padding:"8px",fontSize:12}}>R{fmt(totalActJHB)}</td>
                <td className="mono" style={{textAlign:"right",fontWeight:600,padding:"8px",fontSize:12,color:totalAllocJHB-totalActJHB>=0?"var(--green)":"var(--red)"}}>{totalAllocJHB>0?(totalAllocJHB-totalActJHB>=0?"+":"")+fmt(totalAllocJHB-totalActJHB):"—"}</td>
              </tr>
              <tr>
                <td style={{padding:"6px 8px",color:"var(--dim)",fontSize:12}}>vs City Target</td>
                <td colSpan="3" className="mono" style={{textAlign:"center",padding:"6px 8px",fontSize:11,color:totalAllocCPT<=budgetCPT?"var(--green)":"var(--red)"}}>{totalAllocCPT>0?`R${fmt(totalAllocCPT)} of R${fmt(budgetCPT)} (${((totalAllocCPT/budgetCPT)*100).toFixed(0)}%)`:""}</td>
                <td colSpan="3" className="mono" style={{textAlign:"center",padding:"6px 8px",fontSize:11,color:totalAllocJHB<=budgetJHB?"var(--green)":"var(--red)"}}>{totalAllocJHB>0?`R${fmt(totalAllocJHB)} of R${fmt(budgetJHB)} (${((totalAllocJHB/budgetJHB)*100).toFixed(0)}%)`:""}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ─── COMPARE + NEGOTIATION INTEL ─── */
function Compare({quotes,allQuotes,getSup,cat,setCat,city,setCity,apiKey,suppliers,budgetCPT,budgetJHB,catBudgets}){
  const lowest=quotes.length>0?quotes[0].lineItems.reduce((a,li)=>a+(li.amount||0),0):0;
  const[negBrief,setNegBrief]=useState(null);
  const[negLoading,setNegLoading]=useState(false);

  const genNegotiation=async()=>{
    if(!apiKey){alert("Set your API key in ⚙ API Settings first.");return}
    if(quotes.length<2){alert("Need at least 2 quotes to compare.");return}
    setNegLoading(true);setNegBrief(null);
    const summary=quotes.map(q=>{
      const s=getSup(q.supplierId);
      const total=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
      return{supplier:s?.name||"Unknown",city:q.city,status:q.status,total,lineItems:q.lineItems};
    });
    const catBudget=catBudgets[cat]||{CPT:0,JHB:0};
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          messages:[{role:"user",content:`You are a festival production budget advisor for Milk + Cookies Festival (South Africa). Analyze these competing quotes for the "${cat}" category${city?" in "+city:""} and generate negotiation talking points.

Quote data: ${JSON.stringify(summary)}

Exchange rate: R${RATE}/USD. CPT overall target: R${fmt(budgetCPT)} incl VAT. JHB overall target: R${fmt(budgetJHB)} incl VAT.
Category budget for "${cat}": CPT R${fmt(catBudget.CPT)} | JHB R${fmt(catBudget.JHB)}${catBudget.CPT===0&&catBudget.JHB===0?" (not yet allocated — note this)":""}

Provide:
1. PRICE GAP ANALYSIS — quantify differences between quotes, highlight where specific line items diverge most
2. BUDGET FIT — how each quote sits against the category allocation, who's within budget and who's over
3. LEVERAGE POINTS — what can be used in negotiation (competing bids, volume across 2 cities, multi-year relationship potential for Year 4+)
4. RECOMMENDED APPROACH — who to push on price, who to lock in, suggested counter-offer ranges
5. RISK FLAGS — anything that looks underquoted (too good to be true) or overquoted

Keep it direct and actionable. Format with clear sections. Use ZAR amounts.`}]
        })});
      const data=await resp.json();
      setNegBrief(data.content.map(c=>c.text||"").join(""));
    }catch(e){setNegBrief("Error: "+e.message)}
    setNegLoading(false);
  };

  return(
    <div>
      <h3 style={{marginTop:0}}>Compare Quotes</h3>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:16}}>Select a category to compare supplier quotes side by side. Lowest total is highlighted.</p>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
        <select className="filt" style={{minWidth:220}} value={cat} onChange={e=>{setCat(e.target.value);setNegBrief(null)}}><option value="">Select a category...</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
        <select className="filt" value={city} onChange={e=>{setCity(e.target.value);setNegBrief(null)}}><option value="">Both Cities</option>{CITIES.map(c=><option key={c}>{c}</option>)}</select>
        {cat&&quotes.length>=2&&<button className="btn-primary" onClick={genNegotiation} disabled={negLoading}>{negLoading?"Analyzing...":"⚡ Negotiation Intel"}</button>}
      </div>
      {!cat&&<div className="empty"><p style={{color:"var(--dim)"}}>Pick a category above to start comparing.</p></div>}
      {cat&&quotes.length===0&&<div className="empty"><p>No quotes found for {cat}{city?` in ${city}`:""}</p></div>}
      {quotes.map((q,idx)=>{
        const sup=getSup(q.supplierId);
        const total=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
        const isLow=total===lowest&&quotes.length>1;
        return(
          <div key={q.id} className="q-card" style={{borderLeft:isLow?"3px solid var(--green)":"3px solid transparent"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {isLow&&<span className="badge" style={{background:"var(--green-bg)"}}>Lowest</span>}
                <span className="badge" style={{background:q.city==="CPT"?"var(--green-bg)":"var(--blue-bg)"}}>{q.city}</span>
                <StatusBadge status={q.status}/>
                <span style={{fontWeight:600}}>{sup?.name||"Unknown"}</span>
              </div>
              <div className="mono" style={{color:isLow?"var(--green)":"var(--text)",fontWeight:700,fontSize:16}}>R{fmt(total)}</div>
            </div>
            <table><tbody>{q.lineItems.map((li,i)=>(
              <tr key={i}><td style={{color:"var(--text2)"}}>{li.description}</td><td className="mono" style={{textAlign:"right"}}>R{fmt(li.amount)}</td><td className="mono" style={{textAlign:"right",color:"var(--dim)",fontSize:12}}>{fmtUSD(li.amount)}</td></tr>
            ))}</tbody></table>
            {idx>0&&lowest>0&&<div className="mono" style={{marginTop:6,fontSize:12,color:"var(--red)"}}>+R{fmt(total-lowest)} vs lowest ({((total-lowest)/lowest*100).toFixed(1)}% more)</div>}
          </div>
        );
      })}
      {negLoading&&<div className="negot-brief"><div className="thinking-dots"><span/><span/><span/></div> Generating negotiation brief...</div>}
      {negBrief&&!negLoading&&<div className="negot-brief"><h4 style={{color:"var(--gold)",margin:"0 0 12px",fontSize:13,textTransform:"uppercase",letterSpacing:".6px"}}>Negotiation Intel — {cat}</h4>{negBrief}</div>}
    </div>
  );
}

/* ─── AI INSIGHTS ─── */
async function aiCall(apiKey,systemPrompt,userMsg){
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:systemPrompt,
      messages:[{role:"user",content:userMsg}]
    })});
  if(!resp.ok)throw new Error("API error "+resp.status);
  const data=await resp.json();
  return data.content.map(c=>c.text||"").join("");
}

function buildDataContext(quotes,suppliers,getSup,totByCity,budgetCPT,budgetJHB,catBudgets){
  const approved=quotes.filter(q=>q.status==="Approved");
  const pending=quotes.filter(q=>q.status==="Pending");
  const negotiating=quotes.filter(q=>q.status==="Negotiating");
  const byCat={};
  quotes.forEach(q=>{
    const t=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
    if(!byCat[q.category])byCat[q.category]=[];
    byCat[q.category].push({supplier:getSup(q.supplierId)?.name||"Unknown",city:q.city,status:q.status,total:t});
  });
  const coveredCats=[...new Set(quotes.map(q=>q.category))];
  const missingCats=CATEGORIES.filter(c=>!coveredCats.includes(c));

  // Per-category budget vs actual
  const catActuals={};
  approved.forEach(q=>{
    const t=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
    if(!catActuals[q.category])catActuals[q.category]={CPT:0,JHB:0};
    if(catActuals[q.category][q.city]!==undefined)catActuals[q.category][q.city]+=t;
  });
  const hasCatBudgets=Object.keys(catBudgets||{}).length>0;
  const catBudgetLines=hasCatBudgets?`\nCATEGORY BUDGETS vs APPROVED ACTUALS:\n${CATEGORIES.map(c=>{
    const b=catBudgets[c]||{CPT:0,JHB:0};
    const a=catActuals[c]||{CPT:0,JHB:0};
    if(b.CPT===0&&b.JHB===0&&a.CPT===0&&a.JHB===0)return null;
    return`${c}:\n  CPT: Budget R${fmt(b.CPT)} | Actual R${fmt(a.CPT)} | Var ${b.CPT>0?(b.CPT-a.CPT>=0?"+":"")+fmt(b.CPT-a.CPT):"no budget set"}\n  JHB: Budget R${fmt(b.JHB)} | Actual R${fmt(a.JHB)} | Var ${b.JHB>0?(b.JHB-a.JHB>=0?"+":"")+fmt(b.JHB-a.JHB):"no budget set"}`;
  }).filter(Boolean).join("\n")}`:`\nCATEGORY BUDGETS: Not yet allocated — only overall city targets set.`;

  return`MILK + COOKIES FESTIVAL 2027 — SUPPLIER QUOTE DATA
CPT (Jan 3) budget target: R${fmt(budgetCPT)} incl VAT | Approved spend: R${fmt(totByCity.CPT)}
JHB (Jan 9) budget target: R${fmt(budgetJHB)} incl VAT | Approved spend: R${fmt(totByCity.JHB)}
Exchange rate: R${RATE}/USD

Total quotes: ${quotes.length} (${approved.length} approved, ${pending.length} pending, ${negotiating.length} negotiating)
Suppliers: ${suppliers.length}
Categories covered: ${coveredCats.join(", ")}
Categories with NO quotes: ${missingCats.length>0?missingCats.join(", "):"All covered"}
${catBudgetLines}

QUOTES BY CATEGORY:
${Object.entries(byCat).map(([cat,qs])=>`${cat}:\n${qs.map(q=>`  - ${q.supplier} (${q.city}) — R${fmt(q.total)} [${q.status}]`).join("\n")}`).join("\n\n")}`;
}

[{"type":"risk|warning|info|ok","title":"Short title","body":"1-2 sentence explanation with specific numbers"}]

Check for:

- Positive: categories well under budget or with strong competitive pricing (ok)
Generate 5-12 alerts, ordered by severity.`);
      setAlerts(JSON.parse(result.replace(/```json|```/g,"").trim()));
    }catch(e){setAlerts([{type:"risk",title:"Error",body:e.message}])}

1. EXECUTIVE SUMMARY — 2-3 sentences on overall budget health
2. CITY BREAKDOWN — CPT and JHB approved spend vs targets, % utilized, variance
3. CATEGORY STATUS — which categories are locked in, which are pending, which have gaps
4. KEY RISKS — top 3-5 budget or operational risks based on the data
5. RECOMMENDED ACTIONS — specific next steps (who to follow up with, what to lock in)
6. TIMELINE NOTE — both events are in January 2027, flag any urgency

Use ZAR amounts throughout. Be concise and actionable. This is an internal doc, not a pitch.`);
      setReport(result);

  return(
    <div>

      <p style={{color:"var(--muted)",fontSize:13,marginBottom:16}}>AI-powered analysis of your supplier quotes and budget position.</p>

      <div className="city-tabs" style={{marginBottom:20}}>

        ))}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

            {chatMsgs.map((m,i)=>(
              <div key={i} className={`ai-msg ${m.role==="user"?"user":"bot"}`}>{m.text}</div>
            ))}
            {chatLoading&&<div className="ai-msg bot"><div className="thinking-dots"><span/><span/><span/></div></div>}
            <div ref={msgsEndRef}/>
          </div>
          <div className="ai-input-row" style={{marginTop:12}}>
            <input className="inp" value={chatInput} onChange={e=>setChatInput(e.target.value)} placeholder={noKey?"Set API key first...":"Ask about your budget..."} disabled={noKey} onKeyDown={e=>{if(e.key==="Enter")sendChat()}}/>
            <button className="btn-primary" onClick={sendChat} disabled={chatLoading||noKey}>Send</button>
          </div>
        </div>
      )}

      {tab==="report"&&(
        <div className="ai-section">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <h3 style={{margin:0}}>📋 Budget Status Report</h3>
            <div style={{display:"flex",gap:8}}>
              {report&&<button className="btn-sm" onClick={()=>{navigator.clipboard.writeText(report);alert("Copied to clipboard")}}>Copy</button>}
              <button className="btn-primary" onClick={genReport} disabled={reportLoading||noKey}>{reportLoading?"Generating...":"Generate Report"}</button>
            </div>
          </div>
          {reportLoading&&<div style={{textAlign:"center",padding:24}}><div className="thinking-dots"><span/><span/><span/></div><p style={{color:"var(--muted)",fontSize:13,marginTop:8}}>Building your budget status report...</p></div>}
          {report&&<div className="report-output">{report}</div>}
          {!report&&!reportLoading&&<div className="empty" style={{padding:24}}><p style={{color:"var(--dim)"}}>Generate a formatted budget summary to share with Chase, Jordan, or stakeholders.</p></div>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
