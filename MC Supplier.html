<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M+C Supplier Quotes · SA Festival 2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0f14;--surface:#141820;--surface2:#181d28;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--gold:#d4a054;--gold2:#b8860b;--gold-bg:rgba(212,160,84,0.12);--text:#e2e8f0;--text2:#cbd5e1;--muted:#94a3b8;--dim:#64748b;--dark:#475569;--green:#34d399;--green-bg:#166534;--blue:#60a5fa;--blue-bg:#1e3a5f;--purple:#a78bfa;--orange:#f97316;--orange-bg:#9a3412;--yellow:#fbbf24;--yellow-bg:#a16207;--red:#ef4444;--red-bg:#7f1d1d;--red-light:#fca5a5;--red-dark:#450a0a;--mono:'JetBrains Mono',monospace;--sans:'DM Sans',-apple-system,sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
input,select,button,textarea{font-family:inherit}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#12151c,var(--bg))}
.header-left{display:flex;align-items:center;gap:14px}
.logo{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);font:800 14px var(--mono);padding:8px 10px;border-radius:8px;letter-spacing:1px}
.header h1{font-size:18px;font-weight:700;color:#f1f5f9;letter-spacing:-0.3px}
.header p{font-size:12px;color:var(--dim);margin-top:2px}
.rate{font:500 12px var(--mono);color:var(--gold);background:var(--gold-bg);padding:6px 12px;border-radius:6px}
.nav{display:flex;gap:2px;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap}
.nav button{background:none;border:none;color:var(--dim);font-size:13px;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;transition:all .15s}
.nav button:hover{color:var(--muted)}
.nav button.active{background:var(--gold-bg);color:var(--gold)}
.main{padding:20px 24px;max-width:1000px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card-title{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.card-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;text-align:center;border-top:3px solid var(--blue)}
.stat .val{font:700 28px var(--mono);color:#f1f5f9}
.stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.form-card{background:var(--surface2);border:1px solid rgba(212,160,84,0.2);border-radius:10px;padding:20px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.card-row{flex-direction:column}.header{flex-direction:column;gap:12px;align-items:flex-start}}
label.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px}
input.inp,select.inp,textarea.inp{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;outline:none}
input.inp:focus,select.inp:focus{border-color:var(--gold)}
select.filt{padding:8px 12px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);border:none;padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sm{background:#1e293b;color:var(--text2);border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#2d3a4d}
.btn-danger{background:var(--red-dark);color:var(--red-light)}
.btn-danger:hover{background:#5f0a0a}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:var(--text);display:inline-block}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;transition:border-color .15s}
.q-card:hover{border-color:rgba(255,255,255,0.1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
td{padding:6px 8px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(255,255,255,0.03)}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.bar-track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px}
.bar-fill{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),#e8c47a);transition:width .5s}
.city-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border-radius:8px;padding:4px;width:fit-content}
.city-tab{padding:6px 16px;border-radius:6px;border:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);background:none;transition:all .15s}
.city-tab.active-cpt{background:#166534;color:var(--text)}
.city-tab.active-jhb{background:#1e3a5f;color:var(--text)}
.city-tab.active-all{background:rgba(255,255,255,0.08);color:var(--text)}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mono{font-family:var(--mono)}
.export-bar{display:flex;gap:8px;justify-content:flex-end;padding:8px 24px;border-bottom:1px solid rgba(255,255,255,0.03)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 36px;width:100%;max-width:380px;text-align:center}
.login-box .logo{display:inline-block;margin-bottom:20px;font-size:18px;padding:12px 16px}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.login-box .sub{font-size:13px;color:var(--dim);margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}
.login-box input:focus{border-color:var(--gold)}
.login-box .btn-primary{width:100%;padding:12px;font-size:14px;border-radius:8px}
.login-box .error{color:var(--red);font-size:12px;margin-bottom:12px}
.login-box .hint{color:var(--dim);font-size:11px;margin-top:16px}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--muted);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--red);color:var(--red-light)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;

const RATE=17.01;
const CITIES=["CPT","JHB"];
const CATEGORIES=["Artist Relations & Hospitality","Catering & Concessions","Décor & Environmental Design","Production Crew & Management","Venue Hire","Technical Production","Safety & Security","Site Operations & Infrastructure","VIP & VVIP Experience","Consumables & Contingency","Planning","Production Venues","Permits & Licensing","Site Infrastructure","Production Staff","Insurances & Contingency"];
const STATUSES=["Pending","Approved","Rejected","Negotiating"];
const fmt=n=>n?.toLocaleString("en-ZA",{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtUSD=n=>(n/RATE).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:0});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}

// Auth
async function hashPw(pw){const enc=new TextEncoder().encode(pw);const buf=await crypto.subtle.digest("SHA-256",enc);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")}

function AuthGate({children}){
  const[auth,setAuth]=useState(false);
  const[checking,setChecking]=useState(true);
  const[pw,setPw]=useState("");
  const[pw2,setPw2]=useState("");
  const[err,setErr]=useState("");
  const hasAccount=!!localStorage.getItem("mc-auth-hash");
  const isSetup=!hasAccount;

  useEffect(()=>{
    const s=sessionStorage.getItem("mc-session");
    if(s==="active"&&hasAccount)setAuth(true);
    setChecking(false);
  },[]);

  const handleLogin=async()=>{
    setErr("");
    if(!pw){setErr("Enter your password");return}
    const h=await hashPw(pw);
    const stored=localStorage.getItem("mc-auth-hash");
    if(h===stored){sessionStorage.setItem("mc-session","active");setAuth(true);setPw("")}
    else setErr("Incorrect password")
  };

  const handleSetup=async()=>{
    setErr("");
    if(pw.length<4){setErr("Password must be at least 4 characters");return}
    if(pw!==pw2){setErr("Passwords don't match");return}
    const h=await hashPw(pw);
    localStorage.setItem("mc-auth-hash",h);
    sessionStorage.setItem("mc-session","active");
    setAuth(true);setPw("");setPw2("")
  };

  const logout=()=>{sessionStorage.removeItem("mc-session");setAuth(false);setPw("")};

  if(checking)return null;

  if(!auth){
    return(
      <div className="login-wrap">
        <div className="login-box">
          <div className="logo">M+C</div>
          <h2>{isSetup?"Set Up Password":"Supplier Quotes"}</h2>
          <p className="sub">{isSetup?"Create a password to protect your data":"Enter your password to continue"}</p>
          {err&&<div className="error">{err}</div>}
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder={isSetup?"Create password":"Password"} onKeyDown={e=>{if(e.key==="Enter"){isSetup?handleSetup():handleLogin()}}} autoFocus/>
          {isSetup&&<input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="Confirm password" onKeyDown={e=>{if(e.key==="Enter")handleSetup()}}/>}
          <button className="btn-primary" onClick={isSetup?handleSetup:handleLogin}>{isSetup?"Create Password":"Log In"}</button>
          <p className="hint">{isSetup?"You'll need this password each time you open the app":"Closing the tab will log you out"}</p>
        </div>
      </div>
    );
  }

  return children(logout);
}

function App({logout}){
  const[view,setView]=useState("dashboard");
  const[suppliers,setSuppliers]=useState(()=>load("mc-sup",[]));
  const[quotes,setQuotes]=useState(()=>load("mc-qt",[]));
  const[showSF,setShowSF]=useState(false);
  const[showQF,setShowQF]=useState(false);
  const[editQ,setEditQ]=useState(null);
  const[editS,setEditS]=useState(null);
  const[compCat,setCompCat]=useState("");
  const[compCity,setCompCity]=useState("");
  const[fCity,setFCity]=useState("All");
  const[fCat,setFCat]=useState("All");
  const[fStat,setFStat]=useState("All");
  const[expQ,setExpQ]=useState(null);
  const[supCity,setSupCity]=useState("All");

  useEffect(()=>{save("mc-sup",suppliers)},[suppliers]);
  useEffect(()=>{save("mc-qt",quotes)},[quotes]);

  const addSup=s=>{setSuppliers(p=>[...p,{...s,id:uid()}]);setShowSF(false)};
  const updSup=s=>{setSuppliers(p=>p.map(x=>x.id===s.id?s:x));setEditS(null)};
  const delSup=id=>{setSuppliers(p=>p.filter(x=>x.id!==id));setQuotes(p=>p.filter(q=>q.supplierId!==id))};
  const addQt=q=>{setQuotes(p=>[...p,{...q,id:uid(),created:new Date().toISOString()}]);setShowQF(false)};
  const updQt=q=>{setQuotes(p=>p.map(x=>x.id===q.id?q:x));setEditQ(null)};
  const delQt=id=>setQuotes(p=>p.filter(x=>x.id!==id));
  const getSup=id=>suppliers.find(s=>s.id===id);

  const totByCity=useMemo(()=>{
    const t={CPT:0,JHB:0};
    quotes.filter(q=>q.status==="Approved").forEach(q=>{
      const s=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
      if(t[q.city]!==undefined)t[q.city]+=s;
    });return t;
  },[quotes]);

  const catTotals=useMemo(()=>{
    const t={};
    quotes.filter(q=>q.status==="Approved").forEach(q=>{
      const s=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
      t[q.category]=(t[q.category]||0)+s;
    });return Object.entries(t).sort((a,b)=>b[1]-a[1]);
  },[quotes]);

  const filtQ=useMemo(()=>quotes.filter(q=>{
    if(fCity!=="All"&&q.city!==fCity)return false;
    if(fCat!=="All"&&q.category!==fCat)return false;
    if(fStat!=="All"&&q.status!==fStat)return false;
    return true;
  }),[quotes,fCity,fCat,fStat]);

  const compQ=useMemo(()=>{
    if(!compCat)return[];
    return quotes.filter(q=>{
      if(q.category!==compCat)return false;
      if(compCity&&q.city!==compCity)return false;
      return true;
    }).sort((a,b)=>{
      const sa=a.lineItems.reduce((x,li)=>x+(li.amount||0),0);
      const sb=b.lineItems.reduce((x,li)=>x+(li.amount||0),0);
      return sa-sb;
    });
  },[quotes,compCat,compCity]);

  const filtSup=useMemo(()=>{
    if(supCity==="All")return suppliers;
    return suppliers.filter(s=>s.city===supCity||s.city==="Both");
  },[suppliers,supCity]);

  const exportData=()=>{
    const data=JSON.stringify({suppliers,quotes},null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="mc_supplier_data.json";a.click();
    URL.revokeObjectURL(url);
  };

  const importData=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.suppliers)setSuppliers(d.suppliers);
        if(d.quotes)setQuotes(d.quotes);
        alert("Data imported successfully");
      }catch(err){alert("Invalid file")}
    };
    reader.readAsText(file);
    e.target.value="";
  };

  const changePw=async()=>{
    const cur=prompt("Enter current password:");
    if(!cur)return;
    const h=await hashPw(cur);
    if(h!==localStorage.getItem("mc-auth-hash")){alert("Incorrect current password");return}
    const np=prompt("Enter new password (min 4 chars):");
    if(!np||np.length<4){alert("Password must be at least 4 characters");return}
    const np2=prompt("Confirm new password:");
    if(np!==np2){alert("Passwords don't match");return}
    const nh=await hashPw(np);
    localStorage.setItem("mc-auth-hash",nh);
    alert("Password updated");
  };

  return(
    <div>
      <header className="header">
        <div className="header-left">
          <div className="logo">M+C</div>
          <div><h1>Supplier Quotes</h1><p>SA Festival 2027 · Production Budget Tracking</p></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="rate">R{RATE} / $1</div>
          <button className="logout-btn" onClick={logout}>Log Out</button>
        </div>
      </header>
      <div className="export-bar">
        <button className="btn-sm" onClick={changePw}>Change Password</button>
        <button className="btn-sm" onClick={exportData}>Export Data</button>
        <label className="btn-sm" style={{cursor:"pointer"}}>Import Data<input type="file" accept=".json" onChange={importData} style={{display:"none"}}/></label>
      </div>
      <nav className="nav">
        {[["dashboard","Dashboard"],["quotes","Quotes"],["suppliers","Suppliers"],["compare","Compare"]].map(([k,l])=>(
          <button key={k} className={view===k?"active":""} onClick={()=>setView(k)}>{l}</button>
        ))}
      </nav>
      <main className="main">
        {view==="dashboard"&&<Dashboard quotes={quotes} suppliers={suppliers} totByCity={totByCity} catTotals={catTotals} getSup={getSup}/>}
        {view==="quotes"&&<Quotes quotes={filtQ} suppliers={suppliers} getSup={getSup} fCity={fCity} setFCity={setFCity} fCat={fCat} setFCat={setFCat} fStat={fStat} setFStat={setFStat} showForm={showQF} setShowForm={setShowQF} editQ={editQ} setEditQ={setEditQ} onAdd={addQt} onUpdate={updQt} onDelete={delQt} expQ={expQ} setExpQ={setExpQ}/>}
        {view==="suppliers"&&<Suppliers suppliers={filtSup} allSuppliers={suppliers} quotes={quotes} showForm={showSF} setShowForm={setShowSF} editS={editS} setEditS={setEditS} onAdd={addSup} onUpdate={updSup} onDelete={delSup} supCity={supCity} setSupCity={setSupCity}/>}
        {view==="compare"&&<Compare quotes={compQ} getSup={getSup} cat={compCat} setCat={setCompCat} city={compCity} setCity={setCompCity}/>}
      </main>
    </div>
  );
}

function Dashboard({quotes,suppliers,totByCity,catTotals}){
  const ac=quotes.filter(q=>q.status==="Approved").length;
  const pc=quotes.filter(q=>q.status==="Pending").length;
  const nc=quotes.filter(q=>q.status==="Negotiating").length;
  const tot=totByCity.CPT+totByCity.JHB;
  const mx=catTotals.length>0?catTotals[0][1]:1;
  return(
    <div>
      <div className="card-row">
        <Stat label="Suppliers" value={suppliers.length} color="var(--blue)"/>
        <Stat label="Total Quotes" value={quotes.length} color="var(--purple)"/>
        <Stat label="Approved" value={ac} color="var(--green)"/>
        <Stat label="Pending" value={pc} color="var(--yellow)"/>
        <Stat label="Negotiating" value={nc} color="var(--orange)"/>
      </div>
      <div className="card-row">
        <div className="card" style={{flex:1}}>
          <h3 className="card-title">Approved Spend by City</h3>
          <div style={{display:"flex",gap:24,marginTop:16}}>
            <CityBar label="CPT" amount={totByCity.CPT} target={6000000} color="var(--green)"/>
            <CityBar label="JHB" amount={totByCity.JHB} target={10000000} color="var(--blue)"/>
          </div>
          <div style={{marginTop:16,padding:"12px 16px",background:"rgba(255,255,255,0.03)",borderRadius:8}}>
            <span style={{color:"var(--muted)",fontSize:13}}>Combined Approved</span>
            <span className="mono" style={{float:"right",color:"var(--text)",fontWeight:600}}>R{fmt(tot)} · {fmtUSD(tot)}</span>
          </div>
        </div>
      </div>
      {catTotals.length>0&&(
        <div className="card">
          <h3 className="card-title">Approved Spend by Category</h3>
          <div style={{marginTop:12}}>
            {catTotals.map(([cat,amt])=>(
              <div key={cat} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{color:"var(--text2)",fontSize:13}}>{cat}</span>
                  <span className="mono" style={{color:"var(--text)",fontSize:13}}>R{fmt(amt)}</span>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:`${(amt/mx)*100}%`}}/></div>
              </div>
            ))}
          </div>
        </div>
      )}
      {quotes.length===0&&<div className="empty"><p style={{fontSize:18}}>No quotes yet</p><p style={{fontSize:14,color:"var(--dim)",marginTop:8}}>Add suppliers first, then log quotes to see your budget analysis here.</p></div>}
    </div>
  );
}

function Stat({label,value,color}){
  return <div className="card stat" style={{borderTopColor:color}}><div className="val">{value}</div><div className="lbl">{label}</div></div>;
}

function CityBar({label,amount,target,color}){
  const pct=target>0?Math.min((amount/target)*100,100):0;
  return(
    <div style={{flex:1}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{color,fontWeight:700,fontSize:14}}>{label}</span>
        <span style={{color:"var(--muted)",fontSize:12}}>Target R{fmt(target)}</span>
      </div>
      <div style={{height:8,background:"rgba(255,255,255,0.06)",borderRadius:4}}>
        <div style={{height:8,borderRadius:4,background:color,width:`${pct}%`,transition:"width .5s"}}/>
      </div>
      <div className="mono" style={{marginTop:6,color:"var(--text)",fontSize:14}}>R{fmt(amount)} <span style={{color:"var(--dim)",fontSize:12}}>({pct.toFixed(1)}%)</span></div>
    </div>
  );
}

function StatusBadge({status}){
  const c={Pending:"var(--yellow-bg)",Approved:"var(--green-bg)",Rejected:"var(--red-bg)",Negotiating:"var(--orange-bg)"};
  return <span className="badge" style={{background:c[status]||"#334155"}}>{status}</span>;
}

/* ─── QUOTES ─── */
function Quotes({quotes,suppliers,getSup,fCity,setFCity,fCat,setFCat,fStat,setFStat,showForm,setShowForm,editQ,setEditQ,onAdd,onUpdate,onDelete,expQ,setExpQ}){
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Filt value={fCity} onChange={setFCity} opts={["All",...CITIES]} label="City"/>
          <Filt value={fCat} onChange={setFCat} opts={["All",...CATEGORIES]} label="Category"/>
          <Filt value={fStat} onChange={setFStat} opts={["All",...STATUSES]} label="Status"/>
        </div>
        <button className="btn-primary" onClick={()=>{setEditQ(null);setShowForm(true)}}>+ Add Quote</button>
      </div>
      {(showForm||editQ)&&<QuoteForm suppliers={suppliers} initial={editQ} onSave={editQ?onUpdate:onAdd} onCancel={()=>{setShowForm(false);setEditQ(null)}}/>}
      {quotes.length===0&&!showForm&&<div className="empty"><p>{suppliers.length===0?"Add a supplier first":"No quotes match your filters"}</p></div>}
      {quotes.map(q=>{
        const sup=getSup(q.supplierId);
        const total=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
        const exp=expQ===q.id;
        return(
          <div key={q.id} className="q-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",cursor:"pointer"}} onClick={()=>setExpQ(exp?null:q.id)}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span className="badge" style={{background:q.city==="CPT"?"var(--green-bg)":"var(--blue-bg)"}}>{q.city}</span>
                  <StatusBadge status={q.status}/>
                  <span style={{fontWeight:600}}>{sup?.name||"Unknown"}</span>
                </div>
                <div style={{color:"var(--muted)",fontSize:13}}>{q.category}</div>
                {q.notes&&<div style={{color:"var(--dim)",fontSize:12,marginTop:2}}>{q.notes}</div>}
              </div>
              <div style={{textAlign:"right"}}>
                <div className="mono" style={{fontWeight:600}}>R{fmt(total)}</div>
                <div className="mono" style={{color:"var(--muted)",fontSize:12}}>{fmtUSD(total)}</div>
              </div>
            </div>
            {exp&&(
              <div style={{marginTop:12,borderTop:"1px solid var(--border)",paddingTop:12}}>
                <table><thead><tr><th>Line Item</th><th style={{textAlign:"right"}}>ZAR</th><th style={{textAlign:"right"}}>USD</th></tr></thead>
                <tbody>{q.lineItems.map((li,i)=>(
                  <tr key={i}><td>{li.description}</td><td className="mono" style={{textAlign:"right"}}>R{fmt(li.amount)}</td><td className="mono" style={{textAlign:"right",color:"var(--muted)"}}>  {fmtUSD(li.amount)}</td></tr>
                ))}</tbody></table>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button className="btn-sm" onClick={()=>setEditQ(q)}>Edit</button>
                  <button className="btn-sm btn-danger" onClick={()=>{if(confirm("Delete this quote?"))onDelete(q.id)}}>Delete</button>
                  {q.status!=="Approved"&&<button className="btn-sm" style={{background:"var(--green-bg)"}} onClick={()=>onUpdate({...q,status:"Approved"})}>Approve</button>}
                  {q.status!=="Rejected"&&<button className="btn-sm" style={{background:"var(--red-bg)"}} onClick={()=>onUpdate({...q,status:"Rejected"})}>Reject</button>}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Filt({value,onChange,opts,label}){
  return <select className="filt" value={value} onChange={e=>onChange(e.target.value)}>{opts.map(o=><option key={o} value={o}>{o==="All"?`${label}: All`:o}</option>)}</select>;
}

function QuoteForm({suppliers,initial,onSave,onCancel}){
  const[form,setForm]=useState(initial||{supplierId:suppliers[0]?.id||"",city:"CPT",category:CATEGORIES[0],status:"Pending",notes:"",lineItems:[{description:"",amount:0}]});
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const sli=(i,k,v)=>{const items=[...form.lineItems];items[i]={...items[i],[k]:k==="amount"?parseFloat(v)||0:v};setForm(p=>({...p,lineItems:items}))};
  const ali=()=>setForm(p=>({...p,lineItems:[...p.lineItems,{description:"",amount:0}]}));
  const rli=i=>setForm(p=>({...p,lineItems:p.lineItems.filter((_,j)=>j!==i)}));
  const total=form.lineItems.reduce((a,li)=>a+(li.amount||0),0);

  return(
    <div className="form-card">
      <h3 style={{marginBottom:16}}>{initial?"Edit Quote":"New Quote"}</h3>
      <div className="form-grid">
        <div><label className="lbl">Supplier</label><select className="inp" value={form.supplierId} onChange={e=>sf("supplierId",e.target.value)}><option value="">Select...</option>{suppliers.map(s=><option key={s.id} value={s.id}>{s.name} ({s.city})</option>)}</select></div>
        <div><label className="lbl">City</label><select className="inp" value={form.city} onChange={e=>sf("city",e.target.value)}>{CITIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="lbl">Category</label><select className="inp" value={form.category} onChange={e=>sf("category",e.target.value)}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="lbl">Status</label><select className="inp" value={form.status} onChange={e=>sf("status",e.target.value)}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
      </div>
      <div style={{marginTop:12}}><label className="lbl">Notes</label><input className="inp" value={form.notes} onChange={e=>sf("notes",e.target.value)} placeholder="Optional notes..."/></div>
      <div style={{marginTop:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <label className="lbl">Line Items</label><button className="btn-sm" onClick={ali}>+ Line</button>
        </div>
        {form.lineItems.map((li,i)=>(
          <div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
            <input className="inp" style={{flex:2}} value={li.description} onChange={e=>sli(i,"description",e.target.value)} placeholder="Description"/>
            <input className="inp mono" style={{flex:1}} type="number" value={li.amount||""} onChange={e=>sli(i,"amount",e.target.value)} placeholder="R Amount"/>
            {form.lineItems.length>1&&<button className="btn-sm btn-danger" style={{padding:"4px 10px"}} onClick={()=>rli(i)}>×</button>}
          </div>
        ))}
        <div className="mono" style={{textAlign:"right",marginTop:8,color:"var(--gold)",fontWeight:600}}>Total: R{fmt(total)} · {fmtUSD(total)}</div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button className="btn-primary" onClick={()=>{if(!form.supplierId)return alert("Select a supplier");onSave(form)}}>{initial?"Update":"Save"} Quote</button>
        <button className="btn-sm" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

/* ─── SUPPLIERS ─── */
function Suppliers({suppliers,allSuppliers,quotes,showForm,setShowForm,editS,setEditS,onAdd,onUpdate,onDelete,supCity,setSupCity}){
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <h3 style={{margin:0}}>Supplier Directory ({allSuppliers.length})</h3>
        <button className="btn-primary" onClick={()=>{setEditS(null);setShowForm(true)}}>+ Add Supplier</button>
      </div>
      <div className="city-tabs">
        {["All","CPT","JHB"].map(c=>(
          <button key={c} className={`city-tab ${supCity===c?c==="CPT"?"active-cpt":c==="JHB"?"active-jhb":"active-all":""}`} onClick={()=>setSupCity(c)}>{c==="All"?"All":c==="CPT"?"Cape Town":"Johannesburg"}</button>
        ))}
      </div>
      {(showForm||editS)&&<SupplierForm initial={editS} onSave={editS?onUpdate:onAdd} onCancel={()=>{setShowForm(false);setEditS(null)}}/>}
      {suppliers.length===0&&!showForm&&<div className="empty"><p>{allSuppliers.length===0?"No suppliers yet — add your first vendor.":"No suppliers in this city."}</p></div>}
      <div className="sup-grid">
        {suppliers.map(s=>{
          const sQ=quotes.filter(q=>q.supplierId===s.id);
          const appTot=sQ.filter(q=>q.status==="Approved").reduce((a,q)=>a+q.lineItems.reduce((x,li)=>x+(li.amount||0),0),0);
          return(
            <div key={s.id} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:600,fontSize:15}}>{s.name}</div>
                  <div style={{color:"var(--muted)",fontSize:12,marginTop:2}}>{s.category}</div>
                </div>
                <div style={{display:"flex",gap:4}}>
                  <span className="badge" style={{background:s.city==="CPT"?"var(--green-bg)":s.city==="JHB"?"var(--blue-bg)":"#334155"}}>{s.city}</span>
                  <span className="badge" style={{background:"#1e293b"}}>{sQ.length}</span>
                </div>
              </div>
              {s.contact&&<div style={{color:"var(--dim)",fontSize:12,marginTop:6}}>{s.contact}</div>}
              {s.email&&<div style={{color:"var(--dim)",fontSize:12}}>{s.email}</div>}
              {s.notes&&<div style={{color:"var(--dark)",fontSize:12,marginTop:4,fontStyle:"italic"}}>{s.notes}</div>}
              {appTot>0&&<div className="mono" style={{marginTop:8,color:"var(--green)",fontSize:13}}>Approved: R{fmt(appTot)}</div>}
              <div style={{display:"flex",gap:6,marginTop:10}}>
                <button className="btn-sm" onClick={()=>setEditS(s)}>Edit</button>
                <button className="btn-sm btn-danger" onClick={()=>{if(confirm(`Delete ${s.name} and all their quotes?`))onDelete(s.id)}}>Delete</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SupplierForm({initial,onSave,onCancel}){
  const[form,setForm]=useState(initial||{name:"",city:"CPT",category:CATEGORIES[0],contact:"",email:"",notes:""});
  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  return(
    <div className="form-card">
      <h3 style={{marginBottom:16}}>{initial?"Edit Supplier":"New Supplier"}</h3>
      <div className="form-grid">
        <div><label className="lbl">Name</label><input className="inp" value={form.name} onChange={e=>sf("name",e.target.value)} placeholder="Vendor name"/></div>
        <div><label className="lbl">City</label><select className="inp" value={form.city} onChange={e=>sf("city",e.target.value)}><option>CPT</option><option>JHB</option><option>Both</option></select></div>
        <div><label className="lbl">Primary Category</label><select className="inp" value={form.category} onChange={e=>sf("category",e.target.value)}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="lbl">Contact Person</label><input className="inp" value={form.contact} onChange={e=>sf("contact",e.target.value)} placeholder="Name"/></div>
        <div><label className="lbl">Email</label><input className="inp" value={form.email} onChange={e=>sf("email",e.target.value)} placeholder="email@example.com"/></div>
        <div><label className="lbl">Notes</label><input className="inp" value={form.notes} onChange={e=>sf("notes",e.target.value)} placeholder="Optional..."/></div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:16}}>
        <button className="btn-primary" onClick={()=>{if(!form.name)return alert("Name required");onSave(form)}}>{initial?"Update":"Save"} Supplier</button>
        <button className="btn-sm" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

/* ─── COMPARE ─── */
function Compare({quotes,getSup,cat,setCat,city,setCity}){
  const lowest=quotes.length>0?quotes[0].lineItems.reduce((a,li)=>a+(li.amount||0),0):0;
  return(
    <div>
      <h3 style={{marginTop:0}}>Compare Quotes</h3>
      <p style={{color:"var(--muted)",fontSize:13,marginBottom:16}}>Select a category to compare supplier quotes side by side. Lowest total is highlighted.</p>
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        <select className="filt" style={{minWidth:220}} value={cat} onChange={e=>setCat(e.target.value)}><option value="">Select a category...</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select>
        <select className="filt" value={city} onChange={e=>setCity(e.target.value)}><option value="">Both Cities</option>{CITIES.map(c=><option key={c}>{c}</option>)}</select>
      </div>
      {!cat&&<div className="empty"><p style={{color:"var(--dim)"}}>Pick a category above to start comparing.</p></div>}
      {cat&&quotes.length===0&&<div className="empty"><p>No quotes found for {cat}{city?` in ${city}`:""}</p></div>}
      {quotes.map((q,idx)=>{
        const sup=getSup(q.supplierId);
        const total=q.lineItems.reduce((a,li)=>a+(li.amount||0),0);
        const isLow=total===lowest&&quotes.length>1;
        return(
          <div key={q.id} className="q-card" style={{borderLeft:isLow?"3px solid var(--green)":"3px solid transparent"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                {isLow&&<span className="badge" style={{background:"var(--green-bg)"}}>Lowest</span>}
                <span className="badge" style={{background:q.city==="CPT"?"var(--green-bg)":"var(--blue-bg)"}}>{q.city}</span>
                <StatusBadge status={q.status}/>
                <span style={{fontWeight:600}}>{sup?.name||"Unknown"}</span>
              </div>
              <div className="mono" style={{color:isLow?"var(--green)":"var(--text)",fontWeight:700,fontSize:16}}>R{fmt(total)}</div>
            </div>
            <table><tbody>{q.lineItems.map((li,i)=>(
              <tr key={i}><td style={{color:"var(--text2)"}}>{li.description}</td><td className="mono" style={{textAlign:"right"}}>R{fmt(li.amount)}</td><td className="mono" style={{textAlign:"right",color:"var(--dim)",fontSize:12}}>{fmtUSD(li.amount)}</td></tr>
            ))}</tbody></table>
            {idx>0&&lowest>0&&<div className="mono" style={{marginTop:6,fontSize:12,color:"var(--red)"}}>+R{fmt(total-lowest)} vs lowest ({((total-lowest)/lowest*100).toFixed(1)}% more)</div>}
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate>{(logout)=><App logout={logout}/>}</AuthGate>);
</script>
</body>
</html>
